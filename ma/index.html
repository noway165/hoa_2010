<style>
  /* Layout: cảnh tối điện ảnh, bông hồng giữa khung; nở xong hồng lùi sang trái (máy tính) hoặc lên trên (điện thoại), thiệp kính mờ ở phần còn lại */
  :root {
    --night: #1c0a12;
    --wine: #4a1a2a;
    --glass: rgba(42, 16, 26, .58);
    --text: #fbeee9;
    --muted: #d6b4b4;
    --rose: #f2a3b4;
    --gold: #f1cf94;
    --line: rgba(241, 207, 148, .22);
    --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --body: 'Mulish', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --script: 'Great Vibes', 'Brush Script MT', cursive;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--night); color: var(--text);
    font-family: var(--body); font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .eyebrow { margin: 0; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .intro {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 7vh);
    padding-inline: 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: opacity 1s ease, transform 1s ease;
  }
  .intro h1 {
    margin: 0; font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: clamp(2.1rem, 7vw, 3.6rem); line-height: 1.08; color: var(--text); text-wrap: balance;
    text-shadow: 0 4px 30px rgba(0, 0, 0, .6);
  }
  .intro.gone { opacity: 0; transform: translateY(-14px); }
  .pill {
    pointer-events: auto; cursor: pointer;
    font: 400 .86rem var(--body); color: var(--gold);
    background: rgba(255, 240, 230, .06); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .pill:focus-visible, .card button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .intro .pill { margin-top: 6px; animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 22px rgba(241, 207, 148, .25); transform: translateY(-2px); } }

  .card {
    position: absolute; z-index: 3; box-sizing: border-box; pointer-events: auto;
    left: 56%; top: 50%; transform: translateY(-50%);
    width: min(440px, 38vw); max-height: calc(100% - 48px); overflow: auto;
    padding: 26px 30px 20px; border-radius: 20px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .card.in { animation: cardIn 1.4s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes cardIn { from { opacity: 0; translate: 0 26px; filter: blur(8px); } }
  @media (max-width: 759px), (max-aspect-ratio: 20/21) {
    .card {
      left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
      top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: none;
      width: auto; max-height: 48%; padding: 18px 20px 14px;
    }
  }
  .orn { display: flex; align-items: center; gap: 12px; color: var(--gold); margin-bottom: 8px; opacity: .85; }
  .orn span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
  .orn span:last-child { background: linear-gradient(90deg, var(--line), transparent); }
  .card h2 {
    margin: 6px 0 12px; font-family: var(--display); font-style: italic; font-weight: 500;
    font-size: clamp(1.7rem, 4.4vw, 2.3rem); line-height: 1.15; color: var(--rose); text-wrap: balance;
  }
  .body { font-weight: 300; font-size: 1.04rem; line-height: 1.75; }
  .body p { margin: 0 0 .6em; opacity: 0; transform: translateY(6px); }
  .body.show p { animation: lnIn 1s ease forwards; }
  @keyframes lnIn { to { opacity: 1; transform: none; } }
  .sign-wrap { text-align: right; opacity: 0; transition: opacity 1.2s ease; }
  .sign-wrap.show { opacity: 1; }
  .sign-pre { margin: 0; font-size: .9rem; color: var(--muted); }
  .sign { margin: 0; font-family: var(--script); font-size: 2.6rem; line-height: 1.15; color: var(--gold); display: inline-block; clip-path: inset(0 100% 0 0); }
  .sign-wrap.show .sign { animation: write 1.8s cubic-bezier(.6, .1, .3, 1) .2s forwards; }
  @keyframes write { to { clip-path: inset(0 -10% 0 0); } }
  .card-foot {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between;
  }
  .fact { margin: 0; flex: 1 1 13rem; font-size: .76rem; line-height: 1.5; color: var(--muted); }
  .card button {
    font: 600 .82rem var(--body); color: var(--gold); cursor: pointer;
    background: rgba(255, 240, 230, .06); border: 1px solid var(--line); border-radius: 999px; padding: 8px 15px;
  }
  .card button:hover { background: rgba(255, 240, 230, .14); }
  .rose-hint { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; white-space: nowrap; pointer-events: none; animation: hintIn .9s ease both; }
  @keyframes hintIn { from { opacity: 0; } }
  .bubble {
    position: absolute; z-index: 4; box-sizing: border-box; width: max-content; max-width: min(240px, 80vw);
    padding: 10px 15px 11px; border-radius: 14px; text-align: center;
    background: rgba(255, 246, 240, .96); color: #3d1f28; font-size: .95rem; line-height: 1.45;
    box-shadow: 0 16px 40px -14px rgba(0, 0, 0, .7);
    transform: translate(-50%, calc(-100% - 10px)); transform-origin: 50% 100%;
    animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; pointer-events: none;
  }
  .bubble small { display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: #b24a66; font-weight: 600; margin-bottom: 2px; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px; background: rgba(255, 246, 240, .96); transform: rotate(45deg); }
  @keyframes pop { from { opacity: 0; scale: .7; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .body p { opacity: 1; transform: none; }
    .sign { clip-path: none; }
  }
</style>

<body>

<canvas id="stage" role="img" aria-label="Cận cảnh một bông hồng hồng nở chậm từng lớp cánh, có giọt sương và ánh sáng ấm. Chạm vào bông hồng để nhận thêm lời chúc."></canvas>

<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const TAU = Math.PI * 2;
  const WISH = ["Má ơi,", "20/10 vui vẻ nha má! Con chúc má luôn khỏe, vui vẻ, làm gì cũng thuận lợi.", "Tặng má bông hồng này, má rảnh thì mở ra ngắm nha."].map((w) => w.normalize('NFC'));
  const MSGS = ["Chúc má luôn khỏe.", "Chúc má lúc nào cũng vui.", "Chúc má ăn ngon ngủ kỹ.", "Chúc má bớt lo nghĩ.", "Chúc má đi đâu cũng vui.", "Chúc má trẻ mãi.", "Chúc má cười nhiều.", "Chúc má 20/10 vui vẻ."];
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const rnd = Math.random;
  function seeded(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

  const bodyEl = $('#body');
  WISH.forEach((t) => { const p = document.createElement('p'); p.textContent = t; bodyEl.appendChild(p); });

  const cv = $('#stage');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, portrait = false, R0 = 0;
  let tOpen = -1, clock = 0, last = 0, light = 0, cardShown = false, roseCache = null, cacheKey = '';
  let CX = 0, CY = 0, RS = 0;
  let bokeh = [], motes = [], falling = [], bgLayer = null;

  /* ---------- Cấu trúc bông hồng ---------- */
  const RINGS = [
    { n: 3, L: .36, W: .21, phc: .05, pho: .14, curl: .10, cup: .5, rb: .02, d: 99 },
    { n: 4, L: .46, W: .27, phc: .07, pho: .28, curl: .30, cup: .45, rb: .04, d: 3.8 },
    { n: 5, L: .56, W: .33, phc: .09, pho: .46, curl: .50, cup: .4, rb: .06, d: 3.0 },
    { n: 6, L: .68, W: .38, phc: .11, pho: .70, curl: .70, cup: .35, rb: .08, d: 2.2 },
    { n: 7, L: .80, W: .44, phc: .13, pho: .95, curl: .85, cup: .3, rb: .1, d: 1.3 },
    { n: 8, L: .90, W: .48, phc: .15, pho: 1.18, curl: 1.0, cup: .25, rb: .12, d: 0.3 }
  ];
  const DUR = 2.8;
  const petals = [];
  (function () {
    const r = seeded(20);
    RINGS.forEach((rg, k) => {
      for (let i = 0; i < rg.n; i++) {
        const j = () => (r() - 0.5) * 2;
        petals.push({
          k, th: i * TAU / rg.n + k * 0.83 + j() * 0.12,
          L: rg.L * (1 + j() * 0.06), W: rg.W * (1 + j() * 0.07),
          phc: rg.phc + j() * 0.03, pho: rg.pho + j() * 0.06, curl: rg.curl * (1 + j() * 0.12), cup: rg.cup,
          rb: rg.rb, delay: rg.d + i * 0.12, dew: k >= 4 && i % 3 === 1, open: 0
        });
      }
    });
  })();
  const SEPALS = [0, 1, 2, 3, 4].map((i) => ({ th: i * TAU / 5 + 0.3, L: .55, W: .1 }));

  let CA = Math.cos(0.35), SA = Math.sin(0.35), CAM = 0.35;
  function proj(p) { return { x: CX + p.x * RS, y: CY - (p.y * CA - p.z * SA) * RS, d: p.z * CA + p.y * SA }; }

  function petalGeom(pt, o, green) {
    const phi = lerp(pt.phc, pt.pho, o);
    const curl = pt.curl * o;
    const L = pt.L * (0.82 + 0.18 * o), Wd = pt.W * (0.72 + 0.28 * o);
    const ct = Math.cos(pt.th), st = Math.sin(pt.th);
    const N = 10;
    let pos = { x: ct * pt.rb, y: -0.32, z: st * pt.rb };
    const cl = [pos];
    let d = null;
    for (let i = 1; i <= N; i++) {
      const t = i / N, ph = phi + curl * t * t * t * 1.15;
      d = { x: Math.sin(ph) * ct, y: Math.cos(ph), z: Math.sin(ph) * st };
      pos = { x: pos.x + d.x * L / N, y: pos.y + d.y * L / N, z: pos.z + d.z * L / N };
      cl.push(pos);
    }
    const left = [], right = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const w = Wd * Math.pow(Math.sin(Math.PI * (0.03 + 0.89 * t)), 0.7);
      const cup = pt.cup * (1 - o * 0.55) * w * (green ? 0 : 1);
      const c = cl[i];
      left.push(proj({ x: c.x - st * w - ct * cup, y: c.y, z: c.z + ct * w - st * cup }));
      right.push(proj({ x: c.x + st * w - ct * cup, y: c.y, z: c.z - ct * w - st * cup }));
    }
    const tipP = cl[N];
    const tip = proj({ x: tipP.x + d.x * Wd * 0.3, y: tipP.y + d.y * Wd * 0.3, z: tipP.z + d.z * Wd * 0.3 });
    const phm = phi + curl * 0.4;
    const ny = -Math.sin(phm), nx = Math.cos(phm) * ct, nz = Math.cos(phm) * st;
    const facing = ny * SA + nz * CA;
    const sgn = facing >= 0 ? 1 : -1;
    const lx = -0.45, ly = 0.8, lz = 0.4;
    const bright = clamp01((nx * lx + ny * ly + nz * lz) * sgn * 0.9 + 0.2);
    return { left, right, tip, base: proj(cl[0]), mid: proj(cl[6]), top: proj(cl[N]), outer: facing >= 0, bright, depth: proj(cl[5]).d, w6: Wd * 0.6 };
  }

  function drawPetal(g, gm, k, pal) {
    g.beginPath();
    g.moveTo(gm.left[0].x, gm.left[0].y);
    for (let i = 1; i < gm.left.length; i++) g.lineTo(gm.left[i].x, gm.left[i].y);
    const lt = gm.left[gm.left.length - 1], rt = gm.right[gm.right.length - 1];
    g.quadraticCurveTo(gm.tip.x * 2 - (lt.x + rt.x) / 2, gm.tip.y * 2 - (lt.y + rt.y) / 2, rt.x, rt.y);
    for (let i = gm.right.length - 2; i >= 0; i--) g.lineTo(gm.right[i].x, gm.right[i].y);
    g.closePath();
    const gr = g.createLinearGradient(gm.base.x, gm.base.y, gm.top.x, gm.top.y);
    const c = gm.outer ? pal.out : pal.inn;
    gr.addColorStop(0, c[0]); gr.addColorStop(0.5, c[1]); gr.addColorStop(1, c[2]);
    g.fillStyle = gr; g.fill();
    const dark = (1 - gm.bright) * 0.38 + (5 - k) * 0.035;
    if (dark > 0) { g.fillStyle = 'rgba(70,0,25,' + Math.min(0.55, dark) + ')'; g.fill(); }
    const bs = g.createLinearGradient(gm.base.x, gm.base.y, gm.mid.x, gm.mid.y);
    bs.addColorStop(0, 'rgba(60,0,20,.45)'); bs.addColorStop(1, 'rgba(60,0,20,0)');
    g.fillStyle = bs; g.fill();
    g.strokeStyle = pal.rim; g.lineWidth = Math.max(0.6, RS * 0.004); g.lineJoin = 'round';
    g.stroke();
    if (k >= 2 && pal === PAL) {
      const n = gm.left.length;
      g.beginPath();
      g.moveTo(gm.left[n - 4].x, gm.left[n - 4].y);
      for (let i = n - 3; i < n; i++) g.lineTo(gm.left[i].x, gm.left[i].y);
      const lt = gm.left[n - 1], rt = gm.right[n - 1];
      g.quadraticCurveTo(gm.tip.x * 2 - (lt.x + rt.x) / 2, gm.tip.y * 2 - (lt.y + rt.y) / 2, rt.x, rt.y);
      for (let i = n - 2; i >= n - 4; i--) g.lineTo(gm.right[i].x, gm.right[i].y);
      g.strokeStyle = gm.outer ? 'rgba(255,214,222,.5)' : 'rgba(255,226,232,.35)'; g.lineWidth = Math.max(1.2, RS * 0.016); g.lineCap = 'round';
      g.stroke();
    }
    if (k >= 3) {
      g.save(); g.clip();
      g.strokeStyle = 'rgba(255,230,235,.07)'; g.lineWidth = 0.7;
      for (const f of [-0.35, 0, 0.35]) {
        g.beginPath();
        for (let i = 1; i < gm.left.length; i++) {
          const x = lerp(gm.left[i].x, gm.right[i].x, 0.5 + f * (i / gm.left.length)), y = lerp(gm.left[i].y, gm.right[i].y, 0.5 + f * (i / gm.left.length));
          if (i === 1) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
      g.restore();
    }
  }
  const PAL = {
    inn: ['#ffd3d9', '#ec7892', '#bf3a5a'],
    out: ['#d9617f', '#ec8aa1', '#f7b8c5'],
    rim: 'rgba(120,20,50,.28)'
  };
  const GREEN = { inn: ['#4c7a45', '#3d6a3b', '#2f5530'], out: ['#7fae6a', '#5f8f52', '#47753f'], rim: 'rgba(200,240,190,.25)' };

  function drawHead(g, sway) {
    const list = petals.map((pt) => ({ pt, gm: petalGeom(pt, ease(pt.open), false) }));
    const minOpen = Math.min.apply(null, petals.filter((p) => p.k > 0).map((p) => p.open));
    const so = ease(clamp01(minOpen * 1.3));
    SEPALS.forEach((sp) => {
      const gm = petalGeom({ th: sp.th, L: sp.L, W: sp.W, phc: 0.55, pho: 2.15, curl: 0.5, cup: 0, rb: 0.1 }, so, true);
      drawPetal(g, gm, 5, GREEN);
    });
    list.sort((a, b) => a.gm.depth - b.gm.depth);
    for (const it of list) {
      drawPetal(g, it.gm, it.pt.k, PAL);
      if (it.pt.dew && it.pt.open > 0.85 && !it.gm.outer) {
        const m = it.gm.mid, rr = RS * 0.028;
        const dg = g.createRadialGradient(m.x - rr * 0.35, m.y - rr * 0.35, rr * 0.05, m.x, m.y, rr);
        dg.addColorStop(0, 'rgba(255,255,255,.95)'); dg.addColorStop(0.35, 'rgba(255,220,228,.35)'); dg.addColorStop(0.85, 'rgba(150,40,70,.25)'); dg.addColorStop(1, 'rgba(255,255,255,.5)');
        g.fillStyle = dg; g.beginPath(); g.ellipse(m.x, m.y, rr, rr * 0.8, 0, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,255,' + (0.6 + 0.4 * Math.sin(clock * 3 + it.pt.th * 5)) + ')';
        g.beginPath(); g.arc(m.x - rr * 0.35, m.y - rr * 0.3, rr * 0.18, 0, TAU); g.fill();
      }
    }
  }

  function drawStem(g) {
    const b = proj({ x: 0, y: -0.36, z: 0 });
    const endY = H + 20;
    const sw = Math.max(3, RS * 0.07);
    const gr = g.createLinearGradient(b.x - sw, 0, b.x + sw, 0);
    gr.addColorStop(0, '#2f5530'); gr.addColorStop(0.5, '#5f8f52'); gr.addColorStop(1, '#2b4d2c');
    g.strokeStyle = gr; g.lineWidth = sw; g.lineCap = 'round';
    const c1x = b.x + RS * 0.12, c1y = lerp(b.y, endY, 0.45);
    g.beginPath(); g.moveTo(b.x, b.y); g.quadraticCurveTo(c1x, c1y, b.x - RS * 0.05, endY); g.stroke();
    const at = (t) => { const u = 1 - t; return { x: u * u * b.x + 2 * u * t * c1x + t * t * (b.x - RS * 0.05), y: u * u * b.y + 2 * u * t * c1y + t * t * endY }; };
    [[0.32, 1], [0.55, -1]].forEach(([t, side]) => {
      const p = at(t);
      g.save(); g.translate(p.x, p.y); g.rotate(side * -0.9 + Math.sin(clock * 0.6 + t * 9) * 0.03);
      const L = RS * 0.55, Wl = RS * 0.2;
      g.beginPath(); g.moveTo(0, 0);
      const teeth = 9;
      for (let i = 1; i <= teeth; i++) { const x = side * L * i / teeth, w = Wl * Math.sin(Math.PI * i / teeth); g.lineTo(x - side * L * 0.04, -w * 1.05); g.lineTo(x, -w * 0.9); }
      for (let i = teeth; i >= 0; i--) { const x = side * L * i / teeth, w = Wl * Math.sin(Math.PI * i / teeth); g.lineTo(x, w * 0.9); g.lineTo(x - side * L * 0.04, w * 1.02); }
      g.closePath();
      const lg = g.createLinearGradient(0, -Wl, 0, Wl);
      lg.addColorStop(0, '#7fae6a'); lg.addColorStop(0.5, '#4f7f46'); lg.addColorStop(1, '#2f5530');
      g.fillStyle = lg; g.fill();
      g.strokeStyle = 'rgba(200,240,190,.3)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(side * L * 0.92, 0); g.stroke();
      for (let i = 1; i < 6; i++) { const x = side * L * i / 6; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + side * L * 0.12, -Wl * 0.6); g.moveTo(x, 0); g.lineTo(x + side * L * 0.12, Wl * 0.6); g.stroke(); }
      g.restore();
    });
    for (const t of [0.2, 0.44, 0.7]) {
      const p = at(t);
      g.fillStyle = '#6f4a3a';
      g.beginPath(); g.moveTo(p.x + sw * 0.4, p.y); g.lineTo(p.x + sw * 1.3, p.y - sw * 0.6); g.lineTo(p.x + sw * 0.4, p.y - sw * 0.5); g.closePath(); g.fill();
    }
  }

  /* ---------- Nền ---------- */
  const BOK = ['255,214,170', '255,170,190', '255,236,210', '210,120,150'].map((rgb) => {
    const c = document.createElement('canvas'); c.width = c.height = 96;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(48, 48, 0, 48, 48, 48);
    gr.addColorStop(0, 'rgba(' + rgb + ',.55)'); gr.addColorStop(0.7, 'rgba(' + rgb + ',.28)'); gr.addColorStop(0.9, 'rgba(' + rgb + ',.14)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, 96, 96);
    return c;
  });
  const PETAL_SPR = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); g.translate(32, 34);
    g.beginPath(); g.moveTo(0, 26); g.bezierCurveTo(-24, 12, -24, -18, -6, -26); g.quadraticCurveTo(0, -30, 6, -26); g.bezierCurveTo(24, -18, 24, 12, 0, 26); g.closePath();
    const gr = g.createRadialGradient(0, 22, 2, 0, -4, 34);
    gr.addColorStop(0, '#c4415f'); gr.addColorStop(0.45, '#ee8aa0'); gr.addColorStop(1, '#ffd9df');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(255,230,235,.5)'; g.lineWidth = 1; g.stroke();
    return c;
  })();
  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    portrait = W < 760 || H > W * 1.05;
    R0 = portrait ? Math.min(W * 0.38, H * 0.21) : Math.min(W, H) * 0.3;
    const [c, g] = (() => { const cc = document.createElement('canvas'); cc.width = Math.round(W * DPR); cc.height = Math.round(H * DPR); const gg = cc.getContext('2d'); gg.setTransform(DPR, 0, 0, DPR, 0, 0); return [cc, gg]; })();
    const bgG = g.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.8);
    bgG.addColorStop(0, '#5b2335'); bgG.addColorStop(0.45, '#33121f'); bgG.addColorStop(1, '#14060c');
    g.fillStyle = bgG; g.fillRect(0, 0, W, H);
    const r = seeded(5);
    for (let i = 0; i < W * H / 1400; i++) { g.fillStyle = 'rgba(255,220,220,' + r() * 0.025 + ')'; g.fillRect(r() * W, r() * H, 1, 1); }
    bgLayer = c;
    if (!bokeh.length) {
      bokeh = Array.from({ length: 24 }, () => ({ x: rnd(), y: rnd(), r: 0.02 + rnd() * 0.06, img: BOK[(rnd() * BOK.length) | 0], a: 0.25 + rnd() * 0.45, vx: (rnd() - 0.5) * 0.004, vy: -(0.002 + rnd() * 0.006), ph: rnd() * TAU }));
      motes = Array.from({ length: 70 }, () => ({ x: rnd(), y: rnd(), s: 0.6 + rnd() * 1.6, vx: (rnd() - 0.5) * 0.01, vy: (rnd() - 0.3) * 0.008, ph: rnd() * TAU }));
    }
    roseCache = null; cacheKey = '';
  }

  function drawBackground() {
    ctx.drawImage(bgLayer, 0, 0, W, H);
    const lx = W * 0.12, ly = -H * 0.1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 4; k++) {
      const a = 0.03 + 0.04 * light;
      const ang = Math.atan2(CY - ly, CX - lx) + (k - 1.5) * 0.09 + Math.sin(clock * 0.2 + k) * 0.01;
      const len = Math.hypot(W, H);
      const wd = 0.035 + k * 0.012;
      const g = ctx.createLinearGradient(lx, ly, lx + Math.cos(ang) * len * 0.7, ly + Math.sin(ang) * len * 0.7);
      g.addColorStop(0, 'rgba(255,225,190,' + a * 1.6 + ')'); g.addColorStop(1, 'rgba(255,225,190,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(lx, ly);
      ctx.lineTo(lx + Math.cos(ang - wd) * len, ly + Math.sin(ang - wd) * len);
      ctx.lineTo(lx + Math.cos(ang + wd) * len, ly + Math.sin(ang + wd) * len);
      ctx.closePath(); ctx.fill();
    }
    for (const b of bokeh) {
      const s = b.r * Math.max(W, H);
      ctx.globalAlpha = b.a * (0.25 + 0.75 * light) * (0.7 + 0.3 * Math.sin(clock * 0.6 + b.ph));
      ctx.drawImage(b.img, b.x * W - s, b.y * H - s, s * 2, s * 2);
    }
    const glow = ctx.createRadialGradient(CX, CY - RS * 0.25, 0, CX, CY - RS * 0.25, RS * 2.2);
    glow.addColorStop(0, 'rgba(255,170,190,' + (0.12 + 0.22 * light) + ')'); glow.addColorStop(1, 'rgba(255,170,190,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  function drawMotes() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const m of motes) {
      ctx.globalAlpha = (0.15 + 0.5 * light) * (0.5 + 0.5 * Math.sin(clock * 1.7 + m.ph));
      ctx.fillStyle = '#ffe9cf';
      ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.s, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- Vòng lặp ---------- */
  function update(dt) {
    const o = tOpen < 0 ? -1 : clock - tOpen;
    for (const p of petals) {
      if (tOpen < 0) p.open = 0.02 * (1 + Math.sin(clock * 1.2));
      else if (p.k === 0) p.open = clamp01((o - 3.8) / 3);
      else p.open = clamp01((o - p.delay) / DUR);
    }
    light = tOpen < 0 ? 0.25 + 0.05 * Math.sin(clock) : Math.max(light, clamp01(o / 3));
    const done = tOpen >= 0 && o > 6.4;
    const camT = ease(clamp01(tOpen < 0 ? 0 : (o - 6.2) / 2));
    const zoom = tOpen < 0 ? 0.9 : lerp(0.9, 1.0, ease(clamp01(o / 6)));
    CAM = tOpen < 0 ? 0.35 : lerp(0.35, 0.8, ease(clamp01(o / 6.5)));
    CA = Math.cos(CAM); SA = Math.sin(CAM);
    if (portrait) {
      CX = W * 0.5;
      CY = lerp(H * 0.55, H * 0.33, camT);
      RS = R0 * zoom * lerp(1.15, 0.92, camT);
    } else {
      CX = lerp(W * 0.5, W * 0.32, camT);
      CY = lerp(H * 0.6, H * 0.52, camT);
      RS = R0 * zoom;
    }
    if (done && !cardShown) showCard();
    for (const b of bokeh) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -0.1) { b.y = 1.1; b.x = rnd(); } }
    for (const m of motes) { m.x += (m.vx + Math.sin(clock * 0.5 + m.ph) * 0.004) * dt; m.y += m.vy * dt; if (m.y < -0.02) m.y = 1.02; if (m.y > 1.02) m.y = -0.02; if (m.x < -0.02) m.x = 1.02; if (m.x > 1.02) m.x = -0.02; }
    falling = falling.filter((f) => {
      f.life += dt; f.vy += 40 * dt; f.vy = Math.min(f.vy, 70);
      f.x += (f.vx + Math.sin(f.life * 1.6 + f.ph) * 30) * dt; f.y += f.vy * dt; f.rot += f.vr * dt; f.fl += f.vf * dt;
      return f.y < H + 40;
    });
    if (done && !reduce && rnd() < dt * 0.12) dropPetal();
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    const sway = reduce ? 0 : Math.sin(clock * 0.5) * 0.02;
    const b = proj({ x: 0, y: -0.36, z: 0 });
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(sway); ctx.translate(-b.x, -b.y);
    drawStem(ctx);
    const allOpen = petals.every((p) => p.open >= 1);
    const key = [CX | 0, CY | 0, RS | 0, (CAM * 100) | 0, W, H].join(',');
    if (!allOpen || !roseCache || cacheKey !== key) {
      const pad = RS * 1.9;
      if (!roseCache || roseCache.c.width !== Math.ceil(pad * 2 * DPR)) {
        const c = document.createElement('canvas');
        c.width = Math.ceil(pad * 2 * DPR); c.height = Math.ceil(pad * 2 * DPR);
        roseCache = { c, g: c.getContext('2d'), pad };
      }
      const g = roseCache.g;
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, roseCache.c.width, roseCache.c.height);
      g.setTransform(DPR, 0, 0, DPR, (-CX + pad) * DPR, (-CY + pad) * DPR);
      roseCache.pad = pad;
      drawHead(g);
      g.globalCompositeOperation = 'source-atop';
      const cc = proj({ x: 0, y: 0.05, z: 0 });
      const dk = g.createRadialGradient(cc.x, cc.y, 0, cc.x, cc.y, RS * 0.55);
      dk.addColorStop(0, 'rgba(70,0,25,.55)'); dk.addColorStop(0.6, 'rgba(70,0,25,.18)'); dk.addColorStop(1, 'rgba(70,0,25,0)');
      g.fillStyle = dk; g.fillRect(CX - pad, CY - pad, pad * 2, pad * 2);
      const lt = g.createRadialGradient(CX - RS * 0.6, CY - RS * 0.9, 0, CX - RS * 0.6, CY - RS * 0.9, RS * 1.6);
      lt.addColorStop(0, 'rgba(255,225,215,.22)'); lt.addColorStop(1, 'rgba(255,225,215,0)');
      g.fillStyle = lt; g.fillRect(CX - pad, CY - pad, pad * 2, pad * 2);
      g.globalCompositeOperation = 'source-over';
      cacheKey = allOpen ? key : '';
    }
    ctx.drawImage(roseCache.c, CX - roseCache.pad, CY - roseCache.pad, roseCache.pad * 2, roseCache.pad * 2);
    if (allOpen) {
      for (const p of petals) {
        if (!p.dew) continue;
        const gm = petalGeom(p, 1, false);
        if (gm.outer) continue;
        const m = gm.mid, rr = RS * 0.028;
        ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * Math.sin(clock * 3 + p.th * 5)) + ')';
        ctx.beginPath(); ctx.arc(m.x - rr * 0.35, m.y - rr * 0.3, rr * 0.2, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
    for (const f of falling) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.scale(1, Math.max(0.2, Math.abs(Math.cos(f.fl))));
      ctx.globalAlpha = 0.95;
      ctx.drawImage(PETAL_SPR, -f.s / 2, -f.s / 2, f.s, f.s);
      ctx.restore();
    }
    drawMotes();
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + (0.55 - 0.2 * light) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  function frame(now) {
    const dt = Math.min(0.05, ((now - last) / 1000) || 0);
    last = now; clock += dt;
    update(dt); render();
    requestAnimationFrame(frame);
  }

  function dropPetal(x, y) {
    const hx = x != null ? x : CX + (rnd() - 0.5) * RS * 1.4;
    const hy = y != null ? y : CY - RS * (0.1 + rnd() * 0.3);
    falling.push({ x: hx, y: hy, vx: (rnd() - 0.5) * 30, vy: 10, rot: rnd() * TAU, vr: (rnd() - 0.5) * 2, fl: rnd() * TAU, vf: 2 + rnd() * 2, s: RS * (0.16 + rnd() * 0.08), ph: rnd() * TAU, life: 0 });
  }

  /* ---------- Giao diện ---------- */
  const intro = $('#intro'), card = $('#card'), signWrap = $('#signWrap'), hint = $('#roseHint'), bubble = $('#bubble');
  let timers = [], noteIdx = 0, tapped = false, bubbleTimer = null;
  function showCard() {
    cardShown = true;
    card.hidden = false;
    card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
    bodyEl.querySelectorAll('p').forEach((p, i) => { p.style.animationDelay = (0.6 + i * 0.9) + 's'; });
    bodyEl.classList.add('show');
    const total = reduce ? 0 : (0.6 + WISH.length * 0.9 + 0.4) * 1000;
    timers.push(setTimeout(() => signWrap.classList.add('show'), total));
    timers.push(setTimeout(() => {
      if (tapped) return;
      hint.style.top = portrait ? 'calc(env(safe-area-inset-top, 0px) + 14px)' : 'calc(env(safe-area-inset-top, 0px) + 20px)';
      hint.style.left = portrait ? '50%' : (W * 0.32) + 'px';
      hint.hidden = false;
    }, total + 1800));
  }
  function openRose() {
    if (tOpen >= 0) return;
    tOpen = reduce ? clock - 30 : clock;
    intro.classList.add('gone');
    setTimeout(() => { intro.hidden = true; }, reduce ? 0 : 1000);
    if (reduce) { update(0); render(); }
  }
  function showWish() {
    tapped = true; hint.hidden = true;
    for (let i = 0; i < 2; i++) dropPetal();
    bubble.innerHTML = '';
    const sm = document.createElement('small'); sm.textContent = 'Lời chúc ' + ((noteIdx % MSGS.length) + 1) + '/' + MSGS.length;
    bubble.appendChild(sm); bubble.appendChild(document.createTextNode(MSGS[noteIdx % MSGS.length]));
    noteIdx++;
    bubble.style.left = Math.max(130, Math.min(W - 130, CX)) + 'px';
    bubble.style.top = Math.max(96, CY - RS * 1.1) + 'px';
    bubble.hidden = false;
    bubble.style.animation = 'none'; void bubble.offsetWidth; bubble.style.animation = '';
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => { bubble.hidden = true; }, 4200);
    if (reduce) render();
  }
  $('#openBtn').addEventListener('click', openRose);
  cv.addEventListener('pointerdown', (e) => {
    if (tOpen < 0) { openRose(); return; }
    if (!cardShown) return;
    if (Math.hypot(e.clientX - CX, e.clientY - (CY - RS * 0.25)) < RS * 1.1) showWish();
    else if (!reduce) dropPetal(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', (e) => {
    const over = tOpen < 0 || (cardShown && Math.hypot(e.clientX - CX, e.clientY - (CY - RS * 0.25)) < RS * 1.1);
    cv.style.cursor = over ? 'pointer' : '';
  });
  $('#replay').addEventListener('click', () => {
    timers.forEach(clearTimeout); timers = [];
    bubble.hidden = true; hint.hidden = true;
    card.hidden = true; cardShown = false;
    bodyEl.classList.remove('show'); signWrap.classList.remove('show');
    tOpen = reduce ? clock - 30 : clock; light = 0.3; roseCache = null;
    if (reduce) { update(0); render(); }
  });
  window.addEventListener('resize', () => { layout(); if (reduce) { update(0); render(); } });

  layout();
  update(0);
  if (reduce) render();
  else requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
