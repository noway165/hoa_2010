<style>

<title>Thiệp hoa 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Dancing+Script:wght@600&display=swap">
<style>
  /* Layout: vườn hoa mờ phía sau; phong thư giữa màn hình → mở ra thành hai cột: tranh màu nước | lá thư kẻ dòng */
  :root {
    --blush: #fbdfe8;
    --blush-2: #f5c6d4;
    --paper: #fff7f9;
    --petal: #f2b6c4;
    --rose: #c24d70;
    --rose-light: #f3a3b8;
    --ink: #4b2733;
    --muted: #8a6070;
    --line: #f4d0da;
    --env-back: #eebccb;
    --env-front: #f8d5dd;
    --env-flap: #f2c3cf;
    --display: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
    --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --script: 'Dancing Script', 'Brush Script MT', 'Segoe Script', cursive;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background-color: var(--blush);
    background-image: linear-gradient(180deg, var(--paper) 0%, var(--blush) 45%, var(--blush-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  #garden {
    position: fixed; left: -3%; top: -3%; width: 106%; height: 106%;
    pointer-events: none; z-index: 0;
    filter: blur(7px) saturate(1.05);
    opacity: .85;
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translate(-1.2%, -0.8%) scale(1.02); } }
  #bokeh, #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #sky { z-index: 2; }
  .page {
    position: relative; z-index: 1;
    min-height: 100%;
    display: grid; place-items: center;
    padding-block: 32px;
    box-sizing: border-box;
  }
  .eyebrow { margin: 0; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Phong thư ---------- */
  .intro { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
  .intro > * { animation: enter .9s cubic-bezier(.2, .8, .2, 1) both; }
  .intro > :nth-child(2) { animation-delay: .12s; }
  .intro > :nth-child(3) { animation-delay: .24s; }
  .intro > :nth-child(4) { animation-delay: .5s; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } }
  .intro-title {
    margin: 0; font-family: var(--display); font-style: italic; font-weight: 500;
    font-size: clamp(2.1rem, 7vw, 3.3rem); line-height: 1.08; text-wrap: balance; max-width: 14ch;
    text-shadow: 0 1px 18px rgba(255, 250, 249, .9);
  }
  .hint { margin: 0; font-size: .9rem; color: var(--muted); text-shadow: 0 1px 10px rgba(255, 250, 249, .9); }
  .intro .eyebrow { text-shadow: 0 1px 10px rgba(255, 250, 249, .9); }
  .intro.leaving { animation: leave .7s ease forwards; }
  .intro.leaving > * { animation: none; }
  @keyframes leave { to { opacity: 0; transform: scale(1.06); filter: blur(4px); } }

  .env-wrap { margin-top: 36px; animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .envelope {
    position: relative; display: block;
    width: min(340px, 82vw); max-width: 100%; aspect-ratio: 3 / 2;
    border: 0; padding: 0; background: none; cursor: pointer;
    perspective: 900px;
    filter: drop-shadow(0 18px 22px rgba(194, 77, 112, .22));
    animation: nudge 4.5s ease-in-out 1.5s infinite, glow 2.6s ease-in-out infinite alternate;
    transition: transform .3s ease;
  }
  .envelope:hover { transform: translateY(-4px) rotate(-1.2deg); }
  .envelope:focus-visible { outline: 2px dashed var(--rose); outline-offset: 10px; border-radius: 8px; }
  .envelope.open { animation: none; transform: none; cursor: default; filter: drop-shadow(0 18px 22px rgba(194, 77, 112, .22)) drop-shadow(0 0 30px rgba(255, 255, 255, .95)); }
  @keyframes nudge {
    0%, 82%, 100% { transform: rotate(0); }
    86% { transform: rotate(-2.5deg); } 90% { transform: rotate(2deg); } 94% { transform: rotate(-1deg); }
  }
  @keyframes glow {
    from { filter: drop-shadow(0 18px 22px rgba(194, 77, 112, .22)) drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
    to { filter: drop-shadow(0 18px 22px rgba(194, 77, 112, .22)) drop-shadow(0 0 22px rgba(255, 255, 255, .95)); }
  }
  .env-back { position: absolute; inset: 0; background: var(--env-back); border-radius: 6px; }
  .env-letter {
    position: absolute; left: 7%; right: 7%; top: 6%; height: 82%;
    background: var(--paper); border-radius: 3px; z-index: 1;
    display: flex; justify-content: center; padding-top: 9%; box-sizing: border-box;
    font-family: var(--script); font-size: 1.35rem; color: var(--rose);
    transition: transform .9s cubic-bezier(.2, .8, .2, 1) .45s;
  }
  .env-front {
    position: absolute; inset: 0; z-index: 2; border-radius: 6px;
    background: linear-gradient(to top, var(--env-front), var(--paper) 160%);
    clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%; z-index: 3;
    background: linear-gradient(to bottom, var(--env-flap), var(--env-back));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0;
    transition: transform .65s cubic-bezier(.5, 0, .3, 1), z-index 0s linear .32s;
  }
  .env-shine { position: absolute; inset: 0; z-index: 5; border-radius: 6px; pointer-events: none; overflow: hidden; }
  .env-shine::after {
    content: ""; position: absolute; top: -20%; bottom: -20%; width: 30%; left: -40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
    transform: skewX(-18deg);
    animation: shine 3.6s ease-in-out 1s infinite;
  }
  @keyframes shine { 0% { left: -40%; } 45%, 100% { left: 130%; } }
  .envelope.open .env-shine { display: none; }
  .env-to {
    position: absolute; left: 8%; bottom: 12%; z-index: 3;
    font-family: var(--script); font-size: 1.25rem; color: var(--rose); text-align: left; line-height: 1.2;
  }
  .postmark {
    position: absolute; right: 7%; bottom: 10%; z-index: 3;
    width: 62px; height: 62px; border-radius: 50%;
    border: 1.5px dashed var(--rose); opacity: .6;
    display: grid; place-items: center; text-align: center;
    font-size: .55rem; letter-spacing: .1em; line-height: 1.35; color: var(--rose);
    transform: rotate(-14deg);
  }
  .seal {
    position: absolute; left: 50%; top: 58%; z-index: 4;
    width: 58px; height: 58px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #e07f9b, var(--rose) 62%, #a3395a);
    color: var(--paper); font-family: var(--display); font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .95;
    box-shadow: 0 2px 0 rgba(75, 39, 51, .12), inset 0 0 0 4px rgba(255, 255, 255, .12);
    transition: opacity .35s ease, transform .35s ease;
  }
  .seal b { font-size: 1.15rem; font-weight: 600; }
  .seal i { font-style: normal; font-size: .85rem; border-top: 1px solid rgba(255, 250, 249, .6); padding-top: 1px; }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  .envelope.open .env-letter { transform: translateY(-62%) scale(1.04); }

  /* ---------- Tranh + lá thư ---------- */
  .stage {
    width: 100%; max-width: 1080px;
    display: grid; gap: 28px; align-items: center;
  }
  @media (min-width: 860px) {
    .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; }
  }
  .bouquet {
    position: relative;
    width: 100%; max-width: 460px; aspect-ratio: 4 / 5; justify-self: center;
    animation: enter 1s ease both;
  }
  .bouquet::before {
    content: ""; position: absolute; z-index: 2; top: -11px; left: 50%;
    width: 96px; height: 26px; margin-left: -48px;
    background: rgba(243, 182, 198, .72);
    transform: rotate(-4deg);
    box-shadow: 0 1px 2px rgba(75, 39, 51, .08);
  }
  #flowers {
    display: block; width: 100%; height: 100%;
    background: #fff7f8;
    border-radius: 3px;
    transform: rotate(-1.2deg);
    box-shadow: 0 2px 6px rgba(75, 39, 51, .06), 0 26px 50px -24px rgba(194, 77, 112, .5);
  }

  .paint-hint {
    position: absolute; z-index: 3; left: 14px; bottom: 16px; margin: 0;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 247, 249, .94); color: var(--rose);
    font-size: .78rem; white-space: nowrap;
    box-shadow: 0 4px 14px -6px rgba(194, 77, 112, .5);
    animation: hintBob 2.2s ease-in-out infinite; pointer-events: none;
  }
  @keyframes hintBob { 50% { transform: translateY(-3px); } }
  .bubble {
    position: absolute; z-index: 4; box-sizing: border-box;
    width: max-content; max-width: min(220px, 72%);
    padding: 10px 14px; border-radius: 14px;
    background: var(--paper); color: var(--ink);
    font-size: .9rem; line-height: 1.45; text-align: center; text-wrap: balance;
    box-shadow: 0 12px 30px -10px rgba(194, 77, 112, .6);
    transform: translate(-50%, calc(-100% - 12px));
    transform-origin: 50% 100%;
    animation: pop .4s cubic-bezier(.2, 1.4, .4, 1) both;
    pointer-events: none;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
    background: var(--paper); transform: rotate(45deg);
  }
  .bubble.below { transform: translate(-50%, 12px); transform-origin: 50% 0; }
  .bubble.below::after { bottom: auto; top: -6px; }
  .bubble b { color: var(--rose); font-weight: 500; }
  @keyframes pop { from { opacity: 0; scale: .7; } }
  .ring {
    position: absolute; z-index: 3; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .95);
    box-shadow: 0 0 18px rgba(255, 180, 205, .9), inset 0 0 12px rgba(255, 200, 220, .8);
    transform: translate(-50%, -50%) scale(.6);
    animation: ring .8s ease-out forwards; pointer-events: none;
  }
  @keyframes ring { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

  .letter {
    position: relative; min-width: 0; width: 100%; max-width: 34rem; justify-self: center; box-sizing: border-box;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 1px 0 rgba(75, 39, 51, .05), 0 22px 44px -22px rgba(194, 77, 112, .45);
    padding: 28px clamp(20px, 5vw, 40px) 22px;
    transform-origin: 50% 0;
    animation: unfold 1.1s cubic-bezier(.2, .8, .2, 1) .5s both;
  }
  .letter::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(194, 77, 112, .12), transparent);
  }
  @keyframes unfold {
    from { opacity: 0; transform: perspective(900px) rotateX(-75deg) translateY(-12px); }
    60% { opacity: 1; }
  }
  .letter h2 {
    margin: 8px 0 14px; font-family: var(--display); font-weight: 600;
    font-size: clamp(2.1rem, 6vw, 2.7rem); line-height: 1.1; text-wrap: balance;
    color: var(--rose);
    background: linear-gradient(100deg, var(--rose) 42%, var(--rose-light) 50%, var(--rose) 58%);
    background-size: 260% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5.5s ease-in-out 2.2s infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 45%, 100% { background-position: 0 0; } }
  .typed {
    --row: 1.85rem;
    min-height: calc(var(--row) * 7);
    line-height: var(--row);
    font-size: 1rem;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--row) - 1px), var(--line) calc(var(--row) - 1px), var(--line) var(--row));
    cursor: pointer;
  }
  .typed p { margin: 0 0 var(--row); }
  .typed p:last-child { margin-bottom: 0; }
  .typed .ch { animation: ink .35s ease both; }
  @keyframes ink { from { opacity: 0; filter: blur(3px); } }
  .caret {
    display: inline-block; width: 2px; height: 1.05em; margin-left: 2px;
    background: var(--rose); vertical-align: -0.18em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .skip { margin: 10px 0 0; font-size: .78rem; color: var(--muted); }
  .sign-wrap { text-align: right; margin-top: 14px; opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; }
  .sign-wrap.show { opacity: 1; transform: none; }
  .sign-pre { margin: 0; font-size: .9rem; color: var(--muted); }
  .sign {
    margin: 2px 0 0; font-family: var(--script); font-size: 2.6rem; line-height: 1.1; color: var(--rose);
    display: inline-block;
    clip-path: inset(0 100% 0 0);
  }
  .sign-wrap.show .sign { animation: write 1.4s cubic-bezier(.6, .1, .3, 1) .3s forwards; }
  @keyframes write { to { clip-path: inset(0 -10% 0 0); } }
  .letter-foot {
    display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .fact { margin: 0; flex: 1 1 14rem; font-size: .8rem; line-height: 1.5; color: var(--muted); }
  .replay {
    font: 500 .88rem var(--body); color: var(--rose);
    background: transparent; border: 1px solid var(--petal); border-radius: 999px;
    padding: 9px 16px; cursor: pointer; transition: background .2s ease, transform .2s ease;
  }
  .replay:hover { background: var(--blush); transform: translateY(-1px); }
  .replay:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .sign { clip-path: none; }
  }
</style>
</head>
<body>

<canvas id="garden" aria-hidden="true"></canvas>
<canvas id="bokeh" aria-hidden="true"></canvas>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="page">
  <section class="intro" id="intro">
    <p class="eyebrow">20 · 10 · Ngày Phụ nữ Việt Nam</p>
    <h1 class="intro-title">Có thư cho chị/em nè</h1>
    <div class="env-wrap">
      <button class="envelope" id="envelope" type="button" aria-label="Mở thiệp chúc mừng 20/10">
        <span class="env-back"></span>
        <span class="env-letter">Chúc mừng 20/10</span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-to">Gửi chị/em</span>
        <span class="postmark">20 · 10<br>2026</span>
        <span class="seal"><b>20</b><i>10</i></span>
        <span class="env-shine"></span>
      </button>
    </div>
    <p class="hint">Chạm vào phong thư để mở</p>
  </section>

  <section class="stage" id="stage" hidden>
    <div class="bouquet">
      <canvas id="flowers" role="img" aria-label="Bức tranh bó hoa hồng, tulip và hoa cúc, vẽ nét mực rồi tô màu nước. Chạm vào từng bông để đọc lời chúc riêng."></canvas>
      <p class="paint-hint" id="paintHint" hidden>Chạm vào từng bông hoa nha</p>
      <div class="bubble" id="bubble" role="status" hidden></div>
    </div>
    <article class="letter">
      <p class="eyebrow">Thứ Ba, 20 tháng 10 năm 2026</p>
      <h2>Chúc mừng ngày 20/10!</h2>
      <div class="typed" id="typed" aria-hidden="true" title="Chạm để đọc nhanh"></div>
      <div class="sr" id="fulltext"></div>
      <p class="skip" id="skip">Chạm vào lá thư để đọc nhanh</p>
      <div class="sign-wrap" id="signWrap">
        <p class="sign-pre">Ký tên,</p>
        <p class="sign">Lâm</p>
      </div>
      <div class="letter-foot">
        <p class="fact">20/10 là ngày thành lập Hội Liên hiệp Phụ nữ Việt Nam, năm 1930.</p>
        <button class="replay" id="replay" type="button">Vẽ lại bức tranh</button>
      </div>
    </article>
  </section>
</main>

<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const TAU = Math.PI * 2;

  const WISH = [
    '20/10 vui vẻ nha!',
    'Chúc chị/em luôn khỏe, cười nhiều, làm gì cũng thuận lợi. Bận cỡ nào cũng nhớ dành thời gian cho bản thân.',
    'Tặng chị/em bó hoa nhỏ, không héo được nên cứ giữ lâu lâu.'
  ].map((w) => w.normalize('NFC'));
  $('#fulltext').textContent = WISH.join(' ') + ' Ký tên, Lâm.';

  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);
  function rng(seed) {
    let s = (seed * 2654435761) >>> 0 || 1;
    return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }
  function cubic(a, b, c, d, t) {
    const u = 1 - t;
    return {
      x: u * u * u * a.x + 3 * u * u * t * b.x + 3 * u * t * t * c.x + t * t * t * d.x,
      y: u * u * u * a.y + 3 * u * u * t * b.y + 3 * u * t * t * c.y + t * t * t * d.y
    };
  }
  function cubicD(a, b, c, d, t) {
    const u = 1 - t;
    return {
      x: 3 * u * u * (b.x - a.x) + 6 * u * t * (c.x - b.x) + 3 * t * t * (d.x - c.x),
      y: 3 * u * u * (b.y - a.y) + 6 * u * t * (c.y - b.y) + 3 * t * t * (d.y - c.y)
    };
  }
  const P = (x, y) => ({ x, y });
  function bez(a, b, c, d, n) { const o = []; for (let i = 0; i <= n; i++) o.push(cubic(a, b, c, d, i / n)); return o; }
  function chain(start, segs, n) {
    let pts = [start], cur = start;
    for (const [c1, c2, e] of segs) { const p = bez(cur, c1, c2, e, n); p.shift(); pts = pts.concat(p); cur = e; }
    return pts;
  }
  function tf(pts, C, rot, sc) {
    sc = sc || 1;
    const c = Math.cos(rot), s = Math.sin(rot);
    return pts.map((p) => P(C.x + (p.x * c - p.y * s) * sc, C.y + (p.x * s + p.y * c) * sc));
  }
  function scalePts(pts, C, k) { return pts.map((p) => P(C.x + (p.x - C.x) * k, C.y + (p.y - C.y) * k)); }
  function centroid(pts) { let x = 0, y = 0; pts.forEach((p) => { x += p.x; y += p.y; }); return P(x / pts.length, y / pts.length); }
  function circlePts(C, n, rf) { const o = []; for (let i = 0; i <= n; i++) { const a = i / n * TAU; const r = rf(a); o.push(P(C.x + Math.cos(a) * r, C.y + Math.sin(a) * r)); } return o; }
  function wobble(pts, amp, seed) {
    const r = rng(seed), n = pts.length;
    const f1 = 2 + r() * 3, f2 = 7 + r() * 6, p1 = r() * TAU, p2 = r() * TAU;
    return pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];

  function drawGarden() {

        g.restore();

  function wcFill(c, poly, col, seed, spread, strength) {
    strength = strength == null ? 1 : strength;
    const r = rng(seed);
    const C = centroid(poly);
    for (let L = 0; L < 6; L++) {
      const f1 = 2 + ((r() * 4) | 0), f2 = 5 + ((r() * 5) | 0), p1 = r() * TAU, p2 = r() * TAU;
      const grow = (r() - 0.35) * spread;
      c.beginPath();
      poly.forEach((p, i) => {
        const dx = p.x - C.x, dy = p.y - C.y;
        const a = Math.atan2(dy, dx), d = Math.hypot(dx, dy) || 1;
        const o = grow + spread * 0.5 * (Math.sin(a * f1 + p1) * 0.6 + Math.sin(a * f2 + p2) * 0.4);
        const k = Math.max(0, (d + o) / d);
        const x = C.x + dx * k, y = C.y + dy * k;
        if (i) c.lineTo(x, y); else c.moveTo(x, y);
      });
      c.closePath();
      c.fillStyle = 'rgba(' + col.join(',') + ',' + (0.12 + r() * 0.07) * strength + ')';
      c.fill();
    }
    c.beginPath();
    poly.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
    c.closePath();
    c.strokeStyle = 'rgba(' + col.join(',') + ',' + 0.25 * strength + ')';
    c.lineWidth = Math.max(1, spread * 0.35); c.lineJoin = 'round';

  function wcStroke(c, pts, col, width, seed) {

    for (let L = 0; L < 4; L++) {
      const ox = (r() - 0.5) * width * 0.6, oy = (r() - 0.5) * width * 0.6;

  function grain(c, poly, col, seed) {

  function mkPath(pts, w) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));

  }

  function makeItem(spec) {

    let off = 0;

  function paperPoly(cx, top, half, wave, H, W) {
    const L = cx - W * half, R = cx + W * half;
    let pts = [P(L, top)];
    const bumps = 6;
    for (let k = 0; k < bumps; k++) {
      const x0 = L + (R - L) * (k / bumps), x1 = L + (R - L) * ((k + 1) / bumps);

  function roseShape(C, R, rot, seed) {
    const r = rng(seed);

      const b = rot + k * TAU / 4 + 0.4 + r() * 0.3;

  function cosmosShape(C, R, n, rot, seed) {

    SPRIGS.forEach((s, i) => {
      const tip = P(cx + s.x * W, s.y * H), st = P(cx + s.x * W * 0.1, H * 0.7);
      const stem = bez(st, P(st.x + (tip.x - st.x) * 0.15, (st.y + tip.y) / 2), P(tip.x - (tip.x - st.x) * 0.1, tip.y + H * 0.08), tip, 24);
      const r = rng(90 + i);
      const inks = [stem], dots = [];
      for (let k = 0; k < 10; k++) {
        const a = r() * TAU, rr = W * 0.06 * (0.3 + r() * 0.7);
        const q = P(tip.x + Math.cos(a) * rr, tip.y + Math.sin(a) * rr * 0.8);
        inks.push([tip, P((tip.x + q.x) / 2 + (r() - 0.5) * 3, (tip.y + q.y) / 2), q]);
        const dot = circlePts(q, 8, () => W * (0.006 + r() * 0.004));
        inks.push(dot); dots.push(dot);
      }
      list.push(makeItem({
        g: 'sprig', inks, w: INKW * 0.7, speed: STRUCT, area: [stem].concat(dots),
        center: tip, revealR: W * 0.12,
        wash: (c) => { wcStroke(c, stem, [140, 180, 150], W * 0.006, 95 + i); dots.forEach((d, k) => wcFill(c, d, [236, 200, 220], 100 + k, W * 0.004, 1.6)); }
      }));
    });

    // giấy gói phía trước
    const top = H * 0.58;
    const fpoly = paperPoly(cx, top, 0.27, 0.025, H, W);
    const fold = [P(cx - W * 0.25, top + H * 0.02), P(cx + W * 0.12, top + H * 0.09), P(cx + W * 0.03, H * 0.985)];
    const foldPts = bez(fold[0], P(cx - W * 0.1, top + H * 0.05), P(cx + W * 0.05, top + H * 0.08), fold[1], 12)
      .concat(bez(fold[1], P(cx + W * 0.1, top + H * 0.2), P(cx + W * 0.05, H * 0.8), fold[2], 12).slice(1));
    const foldPoly = foldPts.concat([P(cx - W * 0.05, H * 0.985), fold[0]]);
    list.push(makeItem({
      g: 'front', inks: [wobble(fpoly, W * 0.0015, 7), wobble(foldPts, W * 0.001, 8)], w: INKW, speed: STRUCT,
      area: [fpoly], sil: [fpoly], center: P(cx, H * 0.8), revealR: H * 0.42,
      wash: (c) => {
        base(c, [fpoly]);
        wcFill(c, fpoly, [244, 200, 214], 13, W * 0.012, 1.1);
        wcFill(c, foldPoly, [255, 236, 242], 14, W * 0.008, 2);
        grain(c, fpoly, [200, 120, 140], 15);
        const r = rng(16);
        for (let k = 0; k < 9; k++) {
          const q = P(cx + (r() - 0.5) * W * 0.36, top + H * (0.05 + r() * 0.12));
          wcFill(c, circlePts(q, 10, () => W * 0.009), [226, 120, 150], 17 + k, W * 0.003, 1.5);
        }
      }
    }));

    // nơ
    const B = P(cx, H * 0.775), u = W;
    const loopL = tf(chain(P(0, 0), [[P(-0.1 * u, -0.07 * u), P(-0.13 * u, 0.04 * u), P(0, 0)]], 24), B, 0);
    const loopR = tf(chain(P(0, 0), [[P(0.1 * u, -0.07 * u), P(0.13 * u, 0.04 * u), P(0, 0)]], 24), B, 0);
    const tailL = tf(chain(P(0, 0), [[P(-0.02 * u, 0.04 * u), P(-0.04 * u, 0.09 * u), P(-0.06 * u, 0.13 * u)], [P(-0.05 * u, 0.13 * u), P(-0.04 * u, 0.125 * u), P(-0.035 * u, 0.125 * u)], [P(-0.025 * u, 0.09 * u), P(-0.012 * u, 0.04 * u), P(0, 0)]], 10), B, 0);
    const tailR = tf(chain(P(0, 0), [[P(0.02 * u, 0.04 * u), P(0.04 * u, 0.09 * u), P(0.055 * u, 0.135 * u)], [P(0.065 * u, 0.13 * u), P(0.075 * u, 0.127 * u), P(0.08 * u, 0.125 * u)], [P(0.06 * u, 0.09 * u), P(0.03 * u, 0.04 * u), P(0, 0)]], 10), B, 0);
    const knot = circlePts(B, 16, () => u * 0.018);
    const bowParts = [tailL, tailR, loopL, loopR, knot];
    list.push(makeItem({
      g: 'bow', inks: bowParts, w: INKW, speed: STRUCT, area: bowParts, sil: bowParts,
      center: B, revealR: u * 0.17,
      wash: (c) => {
        base(c, bowParts);
        bowParts.forEach((pp, k) => wcFill(c, pp, k === 4 ? [180, 56, 96] : [216, 96, 130], 120 + k, W * 0.006, 1.3));
        wcFill(c, scalePts(loopL, B, 0.5), [180, 56, 96], 130, W * 0.004, 0.8);
        wcFill(c, scalePts(loopR, B, 0.5), [180, 56, 96], 131, W * 0.004, 0.8);
      }
    }));

    // hoa: phía sau vẽ trước
    heads.slice().sort((a, b) => a.f.y - b.f.y).forEach((h, i) => {
      const f = h.f, R = f.s * W, pal = PALS[f.p], seed = 200 + i * 17;
      const rot = (i * 1.73) % TAU;
      if (f.k === 'r') {
        const s = roseShape(h.P3, R, rot, seed);
        list.push(makeItem({
          g: 'flower', inks: s.inks.map((p, k) => wobble(p, W * 0.0012, seed + k)), w: INKW * 1.05, speed: FLOW,
          area: [s.sil], sil: [s.sil], center: h.P3, revealR: R * 1.15, msg: f.msg, R,
          wash: (c) => {
            base(c, [s.sil]);
            wcFill(c, s.sil, pal.light, seed, R * 0.09, 1.2);
            wcFill(c, scalePts(s.sil, h.P3, 0.72), pal.mid, seed + 1, R * 0.07, 1);
            wcFill(c, scalePts(s.sil, h.P3, 0.4), pal.deep, seed + 2, R * 0.05, 0.9);
            grain(c, s.sil, pal.deep, seed + 3);
          }
        }));
      } else if (f.k === 'c') {
        const s = cosmosShape(h.P3, R, f.n, rot, seed);
        list.push(makeItem({
          g: 'flower', inks: s.inks.map((p, k) => (p.length > 6 ? wobble(p, W * 0.001, seed + k) : p)), w: INKW, speed: FLOW,
          area: s.sil, sil: s.sil, center: h.P3, revealR: R * 1.2, msg: f.msg, R,
          wash: (c) => {
            base(c, s.sil);
            s.petals.forEach((pp, k) => {
              wcFill(c, pp, pal.light, seed + k, R * 0.05, 1.3);
              wcFill(c, scalePts(pp, h.P3, 0.6), pal.mid, seed + 40 + k, R * 0.04, 0.9);
            });
            wcFill(c, s.center, [244, 206, 118], seed + 90, R * 0.03, 2);
            wcFill(c, scalePts(s.center, h.P3, 0.55), [214, 150, 62], seed + 91, R * 0.02, 1.4);
          }
        }));
      } else {
        const s = tulipShape(h.P3, R, f.tilt);
        list.push(makeItem({
          g: 'flower', inks: s.inks.map((p, k) => wobble(p, W * 0.001, seed + k)), w: INKW * 1.05, speed: FLOW,
          area: [s.cup], sil: [s.cup], center: s.center, revealR: R * 1.2, msg: f.msg, R: R * 0.85,
          wash: (c) => {
            base(c, [s.cup]);
            wcFill(c, s.cup, pal.light, seed, R * 0.08, 1.3);
            wcFill(c, scalePts(s.cup, s.bottom, 0.62), pal.mid, seed + 1, R * 0.06, 1);
            wcFill(c, scalePts(s.cup, s.bottom, 0.3), pal.deep, seed + 2, R * 0.04, 0.8);
            grain(c, s.cup, pal.deep, seed + 3);
          }
        }));
      }
    });

    // lịch trình vẽ
    const at = (g) => list.filter((it) => it.g === g);
    const setInk = (it, start) => { it.inkStart = start; it.inkEnd = start + it.inkTotal / it.speed; };
    at('back').forEach((it) => setInk(it, 0.15));
    at('stem').forEach((it, i) => setInk(it, 0.4 + i * 0.06));
    at('leaf').forEach((it, i) => setInk(it, 0.85 + i * 0.04));
    at('sprig').forEach((it, i) => setInk(it, 1.0 + i * 0.1));
    let tcur = Math.max.apply(null, list.map((it) => it.inkEnd || 0)) + 0.05;
    at('front').forEach((it) => { setInk(it, tcur); tcur = it.inkEnd + 0.05; });
    at('bow').forEach((it) => { setInk(it, tcur); tcur = it.inkEnd + 0.05; });
    at('flower').forEach((it) => { setInk(it, tcur); tcur = it.inkEnd + 0.06; });
    list.forEach((it) => {
      it.washStart = it.inkEnd + 0.12;
      it.washEnd = it.washStart + (it.g === 'flower' ? 1.4 : 1.1);
      it.seed = Math.round(it.center.x * 7 + it.center.y * 13);
    });
    lastEnd = Math.max.apply(null, list.map((it) => it.washEnd));
    return list;
  }

  function drawPaper() {
    const pc = paperC.getContext('2d');
    const W = FW, H = FH;
    pc.fillStyle = PAPER; pc.fillRect(0, 0, W, H);
    const r = rng(7);
    const n = Math.round(W * H / 28);
    for (let i = 0; i < n; i++) {
      pc.fillStyle = 'rgba(120,80,95,' + (0.015 + r() * 0.03) + ')';
      pc.fillRect(r() * W, r() * H, 1, 1);
    }
    pc.lineWidth = 0.6;
    for (let i = 0; i < 50; i++) {
      const x = r() * W, y = r() * H, l = 6 + r() * 14, a = r() * TAU;
      pc.strokeStyle = 'rgba(160,110,125,.07)';
      pc.beginPath(); pc.moveTo(x, y); pc.quadraticCurveTo(x + Math.cos(a + 0.5) * l * 0.6, y + Math.sin(a + 0.5) * l * 0.6, x + Math.cos(a) * l, y + Math.sin(a) * l); pc.stroke();
    }
    const g = pc.createRadialGradient(W / 2, H * 0.45, W * 0.3, W / 2, H * 0.45, W * 0.85);
    g.addColorStop(0, 'rgba(244,206,218,0)'); g.addColorStop(1, 'rgba(240,186,204,.45)');
    pc.fillStyle = g; pc.fillRect(0, 0, W, H);
  }

  function build() {
    const w = fc.clientWidth, h = fc.clientHeight;
    if (!w) return false;
    FW = w; FH = h;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    fc.width = Math.round(FW * DPR); fc.height = Math.round(FH * DPR);
    fx.setTransform(DPR, 0, 0, DPR, 0, 0);
    [paperC] = layer(); paperC.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
    drawPaper();
    [inkC, ik] = layer();
    [washC, wk] = layer();
    items = buildItems();
    return true;
  }

  function drawInk(path, to) {
    const pts = path.pts, cum = path.cum;
    let i = path.i, last = path.last || pts[0];
    ik.strokeStyle = INK; ik.lineCap = 'round'; ik.lineJoin = 'round';
    while (i < pts.length - 1 && cum[i] < to) {
      const segEnd = Math.min(cum[i + 1], to);
      const span = cum[i + 1] - cum[i] || 1;
      const f = (segEnd - cum[i]) / span;
      const q = P(pts[i].x + (pts[i + 1].x - pts[i].x) * f, pts[i].y + (pts[i + 1].y - pts[i].y) * f);
      const s = segEnd / (path.len || 1);
      ik.lineWidth = path.w * (0.35 + 0.65 * Math.sqrt(Math.sin(Math.PI * Math.min(1, 0.04 + s * 0.92))));
      ik.beginPath(); ik.moveTo(last.x, last.y); ik.lineTo(q.x, q.y); ik.stroke();
      last = q;
      if (segEnd >= cum[i + 1]) i++; else break;
    }
    path.i = i; path.last = last; path.drawn = to;
  }

  function blob(ctx, C, r, seed, t) {
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const a = i / 40 * TAU;
      const rr = r * (1 + 0.1 * Math.sin(3 * a + seed) + 0.07 * Math.sin(7 * a + seed * 2 + t * 0.8));
      const x = C.x + Math.cos(a) * rr, y = C.y + Math.sin(a) * rr;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  function renderFrame(t) {
    const W = FW, H = FH;
    for (const it of items) {
      if (t < it.inkStart) continue;
      if (it.silPath && !it.knocked) {
        ik.save(); ik.globalCompositeOperation = 'destination-out'; ik.fillStyle = '#000'; ik.fill(it.silPath); ik.restore();
        it.knocked = true;
      }
      if (!it.inkDone) {
        const e = (t - it.inkStart) * it.speed;
        let all = true;
        for (const p of it.paths) {
          const target = Math.max(0, Math.min(p.len, e - p.offset));
          if (target > p.drawn) drawInk(p, target);
          if (p.drawn < p.len) all = false;
        }
        it.inkDone = all;
      }
    }
    for (const it of items) {
      if (!it.baked && t >= it.washEnd) { wk.drawImage(it.wc, it.bb.x, it.bb.y, it.bb.w, it.bb.h); it.baked = true; }
    }
    fx.clearRect(0, 0, W, H);
    fx.drawImage(paperC, 0, 0, W, H);
    fx.drawImage(washC, 0, 0, W, H);
    for (const it of items) {
      if (it.baked || t < it.washStart) continue;
      const p = outCubic(clamp01((t - it.washStart) / (it.washEnd - it.washStart)));
      if (p <= 0.001) continue;
      fx.save();
      blob(fx, it.center, it.revealR * 1.3 * p, it.seed, t);
      fx.clip();
      fx.drawImage(it.wc, it.bb.x, it.bb.y, it.bb.w, it.bb.h);
      fx.restore();
    }
    fx.drawImage(inkC, 0, 0, W, H);
    const sa = clamp01((t - lastEnd + 0.4) / 0.9);
    if (sa > 0) {
      fx.save();
      fx.globalAlpha = sa;
      fx.fillStyle = '#b8456a';
      fx.font = '600 ' + Math.round(W * 0.05) + 'px "Dancing Script", "Brush Script MT", cursive';
      fx.textAlign = 'right';
      fx.fillText('Lâm · 20.10', W * 0.93, H * 0.955);
      fx.restore();
    }
    if (!celebrated && t > lastEnd) { celebrated = true; showPaintHint(); if (!reduce) onBloomed(); }
    return t > lastEnd + 0.6;
  }

  function loop(now) {
    if (!running) return;
    const done = renderFrame((now - t0) / 1000);
    if (done) { running = false; return; }
    requestAnimationFrame(loop);
  }
  function startPainting() {
    if (!build()) return;
    started = true;
    celebrated = false;
    if (reduce) { renderFrame(1e4); return; }
    t0 = performance.now();
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  let lastSize = '';
  if ('ResizeObserver' in window) {
    new ResizeObserver(() => {
      const key = fc.clientWidth + 'x' + fc.clientHeight;
      if (!started || key === lastSize || !fc.clientWidth) return;
      lastSize = key;
      const wasCelebrated = celebrated;
      document.getElementById('bubble').hidden = true;
      build();
      celebrated = wasCelebrated;
      if (!running) renderFrame(running ? (performance.now() - t0) / 1000 : 1e4);
    }).observe(fc);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { if (started && !running) renderFrame(1e4); });
  }

  /* ================= Chữ hiện từng ký tự ================= */
  const typed = $('#typed'), signWrap = $('#signWrap'), skip = $('#skip');
  let typeTimer = null, typing = false;

  function finishTyping() {
    clearTimeout(typeTimer);
    typing = false;
    typed.innerHTML = '';
    WISH.forEach((txt) => { const p = document.createElement('p'); p.textContent = txt; typed.appendChild(p); });
    signWrap.classList.add('show');
    skip.hidden = true;
  }
  function startTyping(delay) {
    clearTimeout(typeTimer);
    typed.innerHTML = '';
    signWrap.classList.remove('show');
    if (reduce) { finishTyping(); return; }
    skip.hidden = false;
    typing = true;
    let pi = 0, ci = 0, para = null;
    const caret = document.createElement('span');
    caret.className = 'caret';
    function newPara() {
      para = document.createElement('p');
      para.appendChild(caret);
      typed.appendChild(para);
    }
    function step() {
      const txt = WISH[pi];
      if (ci < txt.length) {
        const ch = txt[ci++];
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = ch;
        para.insertBefore(span, caret);
        typeTimer = setTimeout(step, ',.!'.includes(ch) ? 300 : 38);
      } else if (pi < WISH.length - 1) {
        pi++; ci = 0; newPara();
        typeTimer = setTimeout(step, 450);
      } else {
        caret.remove();
        typing = false;
        signWrap.classList.add('show');
        skip.hidden = true;
      }
    }
    typeTimer = setTimeout(() => { newPara(); step(); }, delay || 0);
  }
  typed.addEventListener('click', () => { if (typing) finishTyping(); });

  /* ================= Bokeh, tim, lấp lánh, bướm, cánh hoa rơi ================= */

  function sprite(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c; }

    for (const dx of [-11, -5, 0, 5, 11]) { g.beginPath(); g.moveTo(0, 24); g.quadraticCurveTo(dx * 0.5, 2, dx, -22); g.stroke(); }
    const hl = g.createRadialGradient(-8, -8, 0, -8, -8, 18);

  // tim: [sáng, chính, tối]
  const HEART_TONES = [['#ffe0e8', '#f7a7bd', '#e0708f'], ['#fff0f4', '#f9bccb', '#ea8ba4'], ['#ffd6e1', '#f48fab', '#d55a7e'], ['#fff3f6', '#fbd0dc', '#ef9fb5']];
  const HEARTS = HEART_TONES.map((t) => sprite(96, 96, (g) => {
    g.translate(48, 50);

    g.beginPath();
    g.moveTo(0, -s * 0.32);

    g.bezierCurveTo(s * 1.15, -s * 0.25, s * 0.5, -s * 0.95, 0, -s * 0.32);

    hl.addColorStop(0, 'rgba(255,255,255,.95)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fillRect(-48, -48, 96, 96);
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.ellipse(s * 0.36, -s * 0.36, s * 0.1, s * 0.06, 0.6, 0, TAU); g.fill();
    const rl = g.createRadialGradient(s * 0.15, s * 0.32, 0, s * 0.15, s * 0.32, s * 0.35);

    g.restore();
  }));

  const SPARK = sprite(48, 48, (g) => {
    g.translate(24, 24);
    const gl = g.createRadialGradient(0, 0, 0, 0, 0, 22);
    gl.addColorStop(0, 'rgba(255,244,248,.95)'); gl.addColorStop(0.3, 'rgba(255,196,214,.35)'); gl.addColorStop(1, 'rgba(255,196,214,0)');
    g.fillStyle = gl; g.fillRect(-24, -24, 48, 48);
    const s = 14;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.moveTo(0, -s);
    g.quadraticCurveTo(0, 0, s, 0); g.quadraticCurveTo(0, 0, 0, s);
    g.quadraticCurveTo(0, 0, -s, 0); g.quadraticCurveTo(0, 0, 0, -s); g.fill();
  });

  // cánh bướm (nửa phải, gốc cánh ở x=0)
  const BFLY = [
    { deep: '#e07898', mid: '#f6b3c6', light: '#ffe8ef', edge: '#b8456a' },
    { deep: '#d9567c', mid: '#f39ab3', light: '#ffe0ea', edge: '#9e3456' },
    { deep: '#c48ad8', mid: '#ebc6f2', light: '#fcf0ff', edge: '#8e5aa8' },
    { deep: '#ec9a7e', mid: '#f9cdb9', light: '#fff2ea', edge: '#bd6a50' },
    { deep: '#f2a7bd', mid: '#fbd7e1', light: '#ffffff', edge: '#cf7590' },
    { deep: '#e88aa8', mid: '#f8c4d3', light: '#fff4f8', edge: '#b04d70' }
  ].map((c) => sprite(72, 84, (g) => {
    g.translate(3, 44);
    const fore = new Path2D('M0 -4 C10 -30 40 -40 60 -32 C66 -22 54 -6 30 2 Q12 4 0 2 Z');
    const hind = new Path2D('M0 2 C22 0 46 8 44 26 C42 36 28 39 19 35 Q15 45 9 41 Q6 22 0 8 Z');
    const wings = [[hind, 44, 26, [[42, 18], [34, 32], [20, 34]]], [fore, 60, -32, [[58, -30], [50, -14], [40, -4], [30, -36]]]];
    for (const [wing, ex, ey, veins] of wings) {
      const gr = g.createLinearGradient(0, 0, ex, ey);
      gr.addColorStop(0, c.deep); gr.addColorStop(0.45, c.mid); gr.addColorStop(1, c.light);
      g.fillStyle = gr; g.fill(wing);
      g.save(); g.clip(wing);
      g.globalAlpha = 0.5; g.strokeStyle = c.edge; g.lineWidth = 6; g.stroke(wing);
      g.globalAlpha = 0.3; g.lineWidth = 0.8;
      for (const [vx, vy] of veins) { g.beginPath(); g.moveTo(1, 1); g.quadraticCurveTo(vx * 0.5, vy * 0.5 + 3, vx, vy); g.stroke(); }
      g.globalAlpha = 1;
      const sh = g.createRadialGradient(ex * 0.4, ey * 0.45, 0, ex * 0.4, ey * 0.45, 22);
      sh.addColorStop(0, 'rgba(255,255,255,.4)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = sh; g.fillRect(-5, -50, 80, 100);
      g.restore();
      g.strokeStyle = 'rgba(95,47,64,.5)'; g.lineWidth = 0.9; g.stroke(wing);
    }
    g.fillStyle = 'rgba(255,255,255,.92)';
    [[52, -30, 2.2], [57, -24, 1.8], [44, -34, 1.6], [36, 26, 1.8], [28, 33, 1.5]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); });
  }));

  function sizeSky() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    SW = window.innerWidth; SH = window.innerHeight;
    sky.width = Math.round(SW * dpr); sky.height = Math.round(SH * dpr);
    sx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bokehC.width = Math.round(SW); bokehC.height = Math.round(SH);
  }
  function seedBokeh() {
    bokeh = Array.from({ length: 12 }, (_, i) => ({
      x: rnd() * SW, y: rnd() * SH, r: 30 + rnd() * 80,
      vx: (rnd() - 0.5) * 6, vy: -(3 + rnd() * 7),
      img: BOKEH[i % BOKEH.length], a: 0.35 + rnd() * 0.45, ph: rnd() * TAU
    }));
  }
  let gardenTimer = null;
  window.addEventListener('resize', () => {
    sizeSky();
    if (reduce) drawSky(0, 0);
    clearTimeout(gardenTimer);
    gardenTimer = setTimeout(drawGarden, 200);
  });
  sizeSky();
  seedBokeh();

  function spawn(x, y, burst, kind) {
    if (kind === 'spark' || (!kind && rnd() < 0.2)) {
      parts.push({
        kind: 'spark', x, y, burst,
        vx: burst ? (rnd() - 0.5) * 320 : 0, vy: burst ? -(90 + rnd() * 240) : -20,
        size: 10 + rnd() * 14, life: 0, max: burst ? 1.6 + rnd() * 1.4 : 4, ph: rnd() * TAU, rot: rnd() * TAU
      });
      return;
    }
    const z = burst ? 0.8 + rnd() * 0.4 : 0.55 + rnd() * 0.65;
    parts.push({
      kind: 'heart', x, y, burst, z,
      vx: burst ? (rnd() - 0.5) * 300 : 0,
      vy: burst ? -(90 + rnd() * 240) : -(20 + rnd() * 25) * z,
      term: -(22 + rnd() * 22) * z,
      size: (16 + rnd() * 14) * z, spr: pick(HEARTS),
      life: 0, max: burst ? 2.6 + rnd() * 1.4 : 18, ph: rnd() * TAU, spin: rnd() * TAU, ws: 0.8 + rnd() * 1.2, rot: 0
    });
  }
  function spawnPetal(mid) {
    const z = 0.5 + rnd() * 0.7;
    parts.push({
      kind: 'petal', x: rnd() * SW, y: mid ? rnd() * SH * 0.35 : -30, z,
      size: (16 + rnd() * 12) * z, vy: (22 + rnd() * 22) * z + 10, spr: pick(PETALS),
      rot: rnd() * TAU, vr: (rnd() - 0.5) * 1.4, a1: rnd() * TAU, a2: rnd() * TAU,
      w1: 1.5 + rnd() * 2, w2: 1 + rnd() * 1.6, life: 0, ph: rnd() * TAU
    });
  }
  function spawnButterfly(x, y, i) {
    parts.push({
      kind: 'bfly', x, y, heading: -Math.PI / 2 + (rnd() - 0.5) * 1.8,
      speed: 50 + rnd() * 30, k: 0.42 + rnd() * 0.2, spr: BFLY[i % BFLY.length],
      life: 0, ph: rnd() * TAU, fl: rnd() * TAU, glide: false, gt: 1 + rnd(), rot: 0
    });
  }

  function updateBfly(p, dt) {
    p.gt -= dt;
    if (p.gt < 0) { p.glide = !p.glide; p.gt = p.glide ? 0.35 + rnd() * 0.7 : 0.9 + rnd() * 1.8; }
    p.fl += dt * (p.glide ? 3 : 14);
    const m = 70;
    let steer = Math.sin(p.life * 0.9 + p.ph) * 1.1 + Math.sin(p.life * 2.3 + p.ph * 2) * 0.6;
    if (p.x < m || p.x > SW - m || p.y < m || p.y > SH - m) {
      let d = Math.atan2(SH / 2 - p.y, SW / 2 - p.x) - p.heading;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      steer += d * 2.4;
    }
    p.heading += steer * dt;
    const sp = p.speed * (p.glide ? 0.7 : 1);
    p.x += Math.cos(p.heading) * sp * dt;
    p.y += Math.sin(p.heading) * sp * dt + (p.glide ? 14 : -4 + Math.sin(p.fl) * 16) * dt;
    p.rot = p.heading + Math.PI / 2 + Math.sin(p.life * 2 + p.ph) * 0.12;
  }
  function drawBfly(p) {
    const ang = p.glide ? 0.45 + 0.12 * Math.sin(p.fl) : 0.75 + 0.62 * Math.sin(p.fl);
    const flap = Math.max(0.1, Math.cos(ang));
    const k = p.k;
    sx.shadowColor = 'rgba(150,60,90,.22)'; sx.shadowBlur = 8; sx.shadowOffsetY = 6;
    for (const side of [1, -1]) {
      sx.save(); sx.scale(side * flap, 1);
      sx.drawImage(p.spr, -3 * k, -44 * k, 72 * k, 84 * k);
      sx.restore();
    }
    sx.shadowColor = 'transparent'; sx.shadowBlur = 0; sx.shadowOffsetY = 0;
    const bg = sx.createLinearGradient(-3 * k, 0, 3 * k, 0);
    bg.addColorStop(0, '#3e1f2b'); bg.addColorStop(0.5, '#86506a'); bg.addColorStop(1, '#3e1f2b');
    sx.fillStyle = bg;
    sx.beginPath(); sx.ellipse(0, -6 * k, 3 * k, 6 * k, 0, 0, TAU); sx.fill();
    sx.beginPath(); sx.ellipse(0, 12 * k, 2.3 * k, 13 * k, 0, 0, TAU); sx.fill();
    sx.beginPath(); sx.arc(0, -14 * k, 2.6 * k, 0, TAU); sx.fill();
    sx.strokeStyle = '#3e1f2b'; sx.lineWidth = 1;
    for (const sd of [-1, 1]) {
      sx.beginPath(); sx.moveTo(sd * k, -16 * k); sx.quadraticCurveTo(sd * 5 * k, -28 * k, sd * 10 * k, -33 * k); sx.stroke();
      sx.beginPath(); sx.arc(sd * 10 * k, -33 * k, 1.4 * k + 0.4, 0, TAU); sx.fill();
    }
  }

  function drawSky(time, dt) {
    sx.clearRect(0, 0, SW, SH);
    bx.clearRect(0, 0, SW, SH);
    for (const b of bokeh) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -b.r) { b.y = SH + b.r; b.x = rnd() * SW; }
      if (b.x < -b.r) b.x = SW + b.r; else if (b.x > SW + b.r) b.x = -b.r;
      bx.globalAlpha = b.a * (0.75 + 0.25 * Math.sin(time * 0.6 + b.ph));
      bx.drawImage(b.img, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    bx.globalAlpha = 1;
    const wind = Math.sin(windT * 0.23) * 22 + Math.sin(windT * 0.71 + 1) * 12;
    parts = parts.filter((p) => {
      p.life += dt;
      let a;
      if (p.kind === 'bfly') {
        updateBfly(p, dt);
        a = Math.min(1, p.life * 1.5);
      } else if (p.kind === 'petal') {
        p.x += (wind * p.z + Math.sin(p.life * 1.3 + p.ph) * 26 * p.z) * dt;
        p.y += p.vy * dt * (0.75 + 0.35 * Math.abs(Math.cos(p.a1)));
        p.rot += p.vr * dt; p.a1 += p.w1 * dt; p.a2 += p.w2 * dt;
        if (p.y > SH + 40) return false;
        a = Math.min(1, p.life * 2) * (0.55 + 0.45 * (p.z - 0.5) / 0.7);
      } else {
        p.vx -= p.vx * 1.8 * dt;
        p.vy += ((p.term || -30) - p.vy) * 1.1 * dt;
        p.x += p.vx * dt + Math.sin(p.life * 1.1 + p.ph) * 18 * (p.z || 1) * dt;
        p.y += p.vy * dt;
        if (p.kind === 'heart') { p.spin += p.ws * dt; p.rot = Math.sin(p.life * 1.6 + p.ph) * 0.22; }
        else p.rot += dt * 1.2;
        if (p.life > p.max || p.y < -50) return false;
        a = Math.min(1, p.life * 3) * clamp01(1 - p.life / p.max) * clamp01((p.y + 50) / (SH * 0.25));
        if (p.kind === 'heart') a *= 0.6 + 0.35 * p.z;
      }
      sx.save();
      sx.globalAlpha = a;
      sx.translate(p.x, p.y); sx.rotate(p.rot);
      if (p.kind === 'bfly') drawBfly(p);
      else if (p.kind === 'petal') {
        const c2 = Math.cos(p.a2), c1 = Math.cos(p.a1);
        sx.scale(Math.sign(c2 || 1) * Math.max(0.18, Math.abs(c2)), Math.sign(c1 || 1) * Math.max(0.35, Math.abs(c1)));
        sx.drawImage(p.spr, -p.size / 2, -p.size / 2, p.size, p.size);
      } else if (p.kind === 'heart') {
        sx.scale(0.3 + 0.7 * Math.abs(Math.cos(p.spin)), 1);
        const s = p.size * 2.34;
        sx.drawImage(p.spr, -s / 2, -s / 2, s, s);
      } else {
        const s = p.size * (0.6 + 0.4 * Math.sin(p.life * 7 + p.ph));
        sx.drawImage(SPARK, -s / 2, -s / 2, s, s);
      }
      sx.restore();
      return true;
    });
  }

  function skyLoop(now) {
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000);
    lastT = now; windT += dt;
    let hearts = 0, petals = 0;
    for (const p of parts) { if (p.kind === 'petal') petals++; else if (p.kind === 'heart' && !p.burst) hearts++; }
    if (heartsOn && hearts < (SW < 600 ? 10 : 22) && rnd() < 0.08) spawn(rnd() * SW, SH + 20, false, 'heart');
    if (petalsOn && petals < 22 && rnd() < 0.07) spawnPetal();
    drawSky(now / 1000, dt);
    requestAnimationFrame(skyLoop);
  }
  if (reduce) drawSky(0, 0); else requestAnimationFrame(skyLoop);

  function burst(x, y, n, kind) { if (reduce) return; for (let k = 0; k < n; k++) spawn(x, y, true, kind); }

  let seqTimers = [];
  function onBloomed() {
    seqTimers.forEach(clearTimeout); seqTimers = [];
    const r = fc.getBoundingClientRect();
    const cxp = r.left + r.width / 2, cyp = r.top + r.height * 0.35;
    for (let k = 0; k < 24; k++) {
      spawn(r.left + r.width * (0.2 + rnd() * 0.6), r.top + r.height * (0.12 + rnd() * 0.35), true, 'spark');
    }
    // 1. bướm bay ra từ bức tranh
    const have = parts.filter((p) => p.kind === 'bfly').length;
    for (let k = have; k < 6; k++) {
      seqTimers.push(setTimeout(() => spawnButterfly(cxp + (rnd() - 0.5) * r.width * 0.4, cyp + (rnd() - 0.5) * r.height * 0.2, k), (k - have) * 280));
    }
    // 2. cánh hoa rơi
    seqTimers.push(setTimeout(() => { petalsOn = true; for (let k = 0; k < 10; k++) spawnPetal(true); }, 2200));
    // 3. tim bay lên
    seqTimers.push(setTimeout(() => {
      heartsOn = true;
      const waveN = SW < 600 ? 14 : 30;
      for (let k = 0; k < waveN; k++) {
        seqTimers.push(setTimeout(() => {
          spawn(rnd() * SW, SH + 24, false, 'heart');
          const h = parts[parts.length - 1];
          h.vy = -(70 + rnd() * 50) * h.z; h.term = -(40 + rnd() * 25) * h.z; h.size *= 1.15;
        }, k * 90));
      }
    }, 4600));
  }

  /* ================= Mở thiệp ================= */
  const intro = $('#intro'), stage = $('#stage'), env = $('#envelope');
  let opened = false;

  function showStage() {
    intro.hidden = true;
    stage.hidden = false;
    startPainting();
    lastSize = fc.clientWidth + 'x' + fc.clientHeight;
    startTyping(reduce ? 0 : 1800);
  }
  env.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    env.setAttribute('aria-expanded', 'true');
    if (reduce) { showStage(); return; }
    env.classList.add('open');
    setTimeout(() => {
      const r = env.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.3, 22, 'heart');
      burst(r.left + r.width / 2, r.top + r.height * 0.3, 14, 'spark');
    }, 650);
    setTimeout(() => intro.classList.add('leaving'), 1600);
    setTimeout(showStage, 2250);
  });

  document.addEventListener('pointerdown', (e) => {
    if (!opened || e.target.closest('button') || e.target === fc) return;
    burst(e.clientX, e.clientY, 6);
  });

  /* ================= Chạm vào hoa: lời chúc ẩn ================= */
  const bubble = $('#bubble'), paintHint = $('#paintHint'), bouquetEl = $('.bouquet');
  const TILT = 1.2 * Math.PI / 180;
  let bubbleTimer = null, tappedOnce = false;
  function showPaintHint() { if (!tappedOnce) paintHint.hidden = false; }
  function localPoint(e) {
    const r = fc.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    return P(FW / 2 + dx * Math.cos(TILT) - dy * Math.sin(TILT), FH / 2 + dx * Math.sin(TILT) + dy * Math.cos(TILT));
  }
  function toBouquet(p) {
    const dx = p.x - FW / 2, dy = p.y - FH / 2;
    return P(FW / 2 + dx * Math.cos(-TILT) - dy * Math.sin(-TILT), FH / 2 + dx * Math.sin(-TILT) + dy * Math.cos(-TILT));
  }
  function flowerAt(p) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.g === 'flower' && Math.hypot(p.x - it.center.x, p.y - it.center.y) < it.R * 1.05) return it;
    }
    return null;
  }
  fc.addEventListener('pointermove', (e) => {
    fc.style.cursor = celebrated && flowerAt(localPoint(e)) ? 'pointer' : '';
  });
  fc.addEventListener('click', (e) => {
    if (!celebrated) return;
    const it = flowerAt(localPoint(e));
    if (!it) { burst(e.clientX, e.clientY, 5); return; }
    tappedOnce = true;
    paintHint.hidden = true;
    const R = it.R, c = toBouquet(it.center);
    const ring = document.createElement('span');
    ring.className = 'ring';
    ring.style.left = c.x + 'px'; ring.style.top = c.y + 'px';
    ring.style.width = ring.style.height = (R * 2.1) + 'px';
    bouquetEl.appendChild(ring);
    setTimeout(() => ring.remove(), 900);

    bubble.innerHTML = '';
    const b = document.createElement('b'); b.textContent = 'Bông này ';
    bubble.appendChild(b);
    bubble.appendChild(document.createTextNode(it.msg));
    const br = bouquetEl.getBoundingClientRect();
    const below = br.top + c.y - R * 0.9 < 96;
    bubble.classList.toggle('below', below);
    bubble.style.left = Math.max(110, Math.min(FW - 110, c.x)) + 'px';
    bubble.style.top = (below ? c.y + R * 0.9 : c.y - R * 0.9) + 'px';
    bubble.hidden = false;
    bubble.style.animation = 'none'; void bubble.offsetWidth; bubble.style.animation = '';
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => { bubble.hidden = true; }, 4200);

    const px = br.left + c.x, py = br.top + c.y;
    burst(px, py, 8, 'spark');
    if (!reduce) {
      for (let k = 0; k < 6; k++) {
        spawnPetal(true);
        const p = parts[parts.length - 1];
        p.x = px + (rnd() - 0.5) * R; p.y = py + (rnd() - 0.5) * R * 0.6;
        p.vy = 18 + rnd() * 20; p.size *= 0.9;
      }
    }
  });

  $('#replay').addEventListener('click', () => {
    paintHint.hidden = true;
    bubble.hidden = true;
    startPainting();
    startTyping(reduce ? 0 : 1600);
  });
})();
</script>
</body>
</html>
